name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
      - name: Install MinGW
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/ditto/
      - name: Test
        run: go test -count=1 ./...
